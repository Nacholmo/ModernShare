name: Build Windows and Linux apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Linux Tk libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth desktop-file-utils
      - run: python -m pip install -r requirements-app.txt
      - run: python scripts/fetch_test_input.py --outdir build/test-input
      - name: Run all host integration tests
        env:
          MODERNSHARE_STOCK: ${{ github.workspace }}/build/test-input/kc713.fw
          MODERNSHARE_UPDATER: ${{ github.workspace }}/build/test-input/KC713130.exe
        run: python -m unittest discover -s tests -v
      - name: Check Linux GUI flow
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/gui_smoke.py --updater build/test-input/KC713130.exe
      - name: Check Windows GUI flow
        if: runner.os == 'Windows'
        run: python tests/gui_smoke.py --updater build/test-input/KC713130.exe
      - run: python scripts/package_app.py --outdir build/app-package
      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_release_app.py --app build/app-package/release/ModernShare-0.9-Linux-x86_64.AppImage --updater build/test-input/KC713130.exe --report build/app-package/release/verification-Linux.json
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        run: python scripts/verify_release_app.py --app build/app-package/release/ModernShare-0.9-Windows-x86_64.exe --updater build/test-input/KC713130.exe --report build/app-package/release/verification-Windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: ModernShare-0.9-${{ runner.os }}
          if-no-files-found: error
          path: build/app-package/release/*
